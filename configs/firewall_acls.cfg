! Access Control Lists (ACLs) for Inter-Zone Traffic Restriction
! Enforces Least Privilege Access Control across Perimeter Routers/Firewalls[cite: 1]

! 1. Secure Ops to Control Zone Access[cite: 1]
ip access-list extended ACL_SEC_OPS_TO_CONTROL
 permit tcp 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255 eq 443   ! Encrypted HTTPS Management
 permit tcp 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255 eq 502   ! Modbus TCP for SCADA/HMI[cite: 1]
 permit icmp 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255        ! Ping/Diagnostics
 deny ip any any log

! 2. Enterprise Zone Isolation (Block Direct OT Access)[cite: 1]
ip access-list extended ACL_ENTERPRISE_INBOUND
 deny ip 192.168.30.0 0.0.0.255 192.168.20.0 0.0.0.255           ! Deny Enterprise to Control Zone[cite: 1]
 deny ip 192.168.30.0 0.0.0.255 192.168.40.0 0.0.0.255           ! Deny Enterprise to Field Zone[cite: 1]
 permit tcp 192.168.30.0 0.0.0.255 192.168.10.0 0.0.0.255 eq 80  ! Permit HTTP to Corporate Web
 permit ip 192.168.30.0 0.0.0.255 192.168.50.0 0.0.0.255          ! Permit Access to DMZ Services[cite: 1]
 deny ip any any

! 3. Apply ACLs to Interfaces
interface GigabitEthernet0/1
 ip access-group ACL_SEC_OPS_TO_CONTROL in

interface GigabitEthernet0/2
 ip access-group ACL_ENTERPRISE_INBOUND in