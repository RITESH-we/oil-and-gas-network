! Core Switch Configuration for Secure Ops Zone
! Device: Cisco Catalyst 9300 / Cisco IOS

hostname CORE-SWITCH-SEC-OPS
boot-start-marker
boot-end-marker

! Enable Inter-VLAN Routing
ip routing

! VLAN Provisioning[cite: 1]
vlan 10
 name SECURE_OPS
vlan 20
 name CONTROL_ZONE
vlan 30
 name ENTERPRISE_ZONE
vlan 40
 name FIELD_ZONE
vlan 50
 name DMZ_ZONE
exit

! Interface Configurations for SVI (Switched Virtual Interfaces)
interface Vlan10
 description Gateway for Secure Operations Zone[cite: 1]
 ip address 192.168.10.1 255.255.255.0
 no shutdown

interface Vlan20
 description Gateway for Control Zone[cite: 1]
 ip address 192.168.20.1 255.255.255.0
 no shutdown

interface Vlan30
 description Gateway for Enterprise Zone[cite: 1]
 ip address 192.168.30.1 255.255.255.0
 no shutdown

interface Vlan40
 description Gateway for Field Zone[cite: 1]
 ip address 192.168.40.1 255.255.255.0
 no shutdown

interface Vlan50
 description Gateway for DMZ Zone[cite: 1]
 ip address 192.168.50.1 255.255.255.0
 no shutdown

! Uplink Ports Configuration (Trunking)
interface GigabitEthernet0/1
 description Uplink to Control Zone Switch
 switchport mode trunk
 switchport trunk allowed vlan 10,20
 no shutdown

interface GigabitEthernet0/2
 description Uplink to Enterprise Zone Switch
 switchport mode trunk
 switchport trunk allowed vlan 10,30
 no shutdown

end